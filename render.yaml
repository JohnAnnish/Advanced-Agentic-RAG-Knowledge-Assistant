services:
  # The FastAPI Web Service (100% Free Tier)
  - type: web
    name: agentic-rag-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: OPENAI_API_KEY
        sync: false # Render will prompt you to enter this in the dashboard
      - key: DATABASE_URL
        value: "sqlite:///./dummy.db" # Dummy value since we fallback to FAISS locally
